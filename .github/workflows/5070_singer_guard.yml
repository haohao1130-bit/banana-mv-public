name: RTX 5070 SRT singer guard regression
on:
  push:
    branches:
      - experiment/rtx5070-480p-local
  workflow_dispatch:
jobs:
  locked-singer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy
      - run: python -m unittest discover -s tests -p test_locked_shoot.py -v
      - run: python -m compileall -q banana_mv/locked_shoot.py
