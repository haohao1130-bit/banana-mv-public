name: RTX 5070 per-clip prompt workbench
on:
  push:
    branches:
      - experiment/rtx5070-480p-local
  workflow_dispatch:
jobs:
  manual-prompt:
    runs-on: ubuntu-latest
    env:
      BANANA_DATA: /tmp/banana-mv-manual-prompt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: python -m pip install Pillow numpy
      - run: python -m unittest discover -s tests -p test_manual_prompt.py -v
      - run: python -m unittest discover -s tests -p test_takes.py -v
      - run: node tests/check_ui.cjs
      - run: python -m compileall -q banana_mv/manual_prompt.py banana_mv/takes.py banana_mv/server.py
