name: RTX 5070 FL2VA isolated checks
on:
  push:
    branches:
      - experiment/rtx5070-fl2va-pruned-int8
  workflow_dispatch:
jobs:
  fl2va:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow numpy
      - run: python -m unittest discover -s tests -p test_fl2va_experiment.py -v
      - run: python -m banana_mv.fl2va_experiment --first-frame sample.png --audio sample.wav --seconds 10 --profile turbo8 --workflow-out /tmp/fl2va_5070.json
      - run: python -m compileall -q banana_mv/fl2va_experiment.py
