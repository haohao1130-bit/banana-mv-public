name: Local checks
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BANANA_DATA: /tmp/banana-mv-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install Pillow numpy ipywidgets
      - run: python -m unittest discover -s tests
      - run: node tests/check_ui.cjs
      - run: python tools/build_notebook.py && git diff --exit-code Banana_MV_Public.ipynb

  windows-launchers:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: powershell
        run: |
          Get-ChildItem tools/*classic*.ps1 | ForEach-Object {
            $parseErrors = $null
            $tokens = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
